<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI SEO Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">
    <div class="login-card fade-in">
        <div class="text-center">
            <div class="logo-circle">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="text-muted mb-4">Sign in to your AI SEO Dashboard</p>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="position-relative">
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control border-end-0" placeholder="••••••••">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" style="border-top-right-radius: 12px; border-bottom-right-radius: 12px;">
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 text-muted" style="font-size: 0.9rem;">
                <div class="form-check">
                    <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#">Forgot Password?</a>
            </div>

            <button class="btn btn-primary w-100 login-btn" type="button" id="loginBtn">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-4 text-muted" style="font-size: 0.9rem;">
            Don't have an account? <a href="register.html" class="fw-semibold">Create one</a>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
