<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI SEO Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container py-5">
    <div class="login-card fade-in">
        <div class="text-center">
            <div class="logo-circle">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h2>Create Account</h2>
            <p class="text-muted mb-4">Start your SEO growth journey today</p>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullname" class="form-control" placeholder="John Doe">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@company.com">
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control border-end-0" placeholder="Create a strong password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" style="border-top-right-radius: 12px; border-bottom-right-radius: 12px;">
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary w-100 login-btn mb-3" type="button" id="registerBtn">
                Create Account <i class="bi bi-person-plus"></i>
            </button>
            
            <p class="text-muted text-center" style="font-size: 0.8rem;">
                By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
            </p>
        </form>

        <div class="text-center mt-4 text-muted" style="font-size: 0.9rem;">
            Already have an account? <a href="login.html" class="fw-semibold">Sign in</a>
        </div>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
